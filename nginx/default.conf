# Serve static files only; the Gateway routes /api directly to ordering.
# No upstream configuration or start-up template rendering is needed.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite names these with a content hash, so a given URL never changes contents.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell document must be revalidated, otherwise a deploy would keep serving the old asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Do not cache runtime config: deployments replace it at the same URL.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Explicit probes avoid the SPA fallback's unconditional 200.
    # Liveness excludes bundle and API checks so dependency failures cannot trigger restarts.
    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Gate readiness on the bundle, not the API, so the UI can still display backend errors.
    # Probes read the status code; a healthy response serves index.html.
    location = /health/ready {
        access_log off;
        root /usr/share/nginx/html;
        try_files /index.html =503;
    }

    # Client-side routes are not files on disk, so unknown paths fall through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
